<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SplitIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                pink: '#ec4899', // Pink-500
                orange: '#f97316', // Orange-500
                purple: '#a855f7', // Purple-500
              },
              neutral: {
                850: '#1f1f1f',
                900: '#121212',
                950: '#000000',
              }
            },
            backgroundImage: {
              'brand-gradient': 'linear-gradient(135deg, #f97316 0%, #ec4899 50%, #a855f7 100%)',
              'brand-gradient-hover': 'linear-gradient(135deg, #fb923c 0%, #f472b6 50%, #c084fc 100%)',
            }
          }
        }
      }
    </script>
    <style>
      /* Mobile-like touch behavior */
      body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "tailwindcss": "https://esm.sh/tailwindcss@^4.1.17",
    "next/": "https://esm.sh/next@^16.0.8/",
    "next": "https://esm.sh/next@^16.0.8",
    "@libsql/client/web": "https://esm.sh/@libsql/client@0.14.0/web",
    "@libsql/client/": "https://esm.sh/@libsql/client@^0.15.15/"
  }
}
</script>
</head>
  <body class="bg-white dark:bg-black text-neutral-900 dark:text-white h-screen overflow-hidden flex flex-col transition-colors duration-200 font-sans">
    <div id="root" class="flex-1 flex flex-col h-full w-full max-w-md mx-auto bg-white dark:bg-black shadow-2xl overflow-hidden relative transition-colors duration-200 border-x border-neutral-100 dark:border-neutral-900"></div>
    <script>
        try {
            const stored = localStorage.getItem('trip_splitter_data_v2');
            if (stored) {
                const data = JSON.parse(stored);
                const theme = data.settings?.theme || 'system';
                
                if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            }
        } catch (e) {}
    </script>
  </body>
</html>
