
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SplitIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                pink: '#ec4899',
                orange: '#f97316',
                purple: '#a855f7',
              },
              neutral: {
                850: '#1f1f1f',
                900: '#121212',
                950: '#000000',
              }
            },
            backgroundImage: {
              'brand-gradient': 'linear-gradient(135deg, #f97316 0%, #ec4899 50%, #a855f7 100%)',
              'brand-gradient-hover': 'linear-gradient(135deg, #fb923c 0%, #f472b6 50%, #c084fc 100%)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@7?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react",
    "@libsql/client/web": "https://esm.sh/@libsql/client@0.14.0/web",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "tailwindcss": "https://esm.sh/tailwindcss@^4.1.18",
    "next/": "https://esm.sh/next@^16.1.1/",

  }
}
</script>
  </head>
  <body class="bg-white dark:bg-black text-neutral-900 dark:text-white h-screen overflow-hidden flex flex-col transition-colors duration-200 font-sans">
    <div id="root" class="flex-1 flex flex-col h-full w-full max-w-md mx-auto bg-white dark:bg-black shadow-2xl overflow-hidden relative transition-colors duration-200 border-x border-neutral-100 dark:border-neutral-900"></div>
    
    <!-- Entry point for the React App -->
    <script type="module" src="index.tsx"></script>

    <script>
        try {
            const stored = localStorage.getItem('trip_splitter_data_v3');
            if (stored) {
                const data = JSON.parse(stored);
                const theme = data.settings?.theme || 'system';
                if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            }
        } catch (e) {}
    </script>
  </body>
</html>
